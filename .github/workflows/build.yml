name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
